<script>
/**
 * 1. Screenshot Manager
 */
class ScreenshotManager {
  constructor(map, buttonId) {
    this.map = map;
    this.button = document.getElementById(buttonId);
    if(this.button) this._attachEvents();
  }

  _attachEvents() {
    this.button.addEventListener("click", () => this.copyScreenshot());
  }

  async copyScreenshot() {
    try {
      const mapEl = document.getElementById("map");
      const canvas = await html2canvas(mapEl, {
        useCORS: true,
        allowTaint: false,
        backgroundColor: null,
        logging: false,
        scale: window.devicePixelRatio
      });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      alert("Screenshot copied to clipboard!");
    } catch (err) {
      console.error(err);
      alert("Could not copy screenshot — browser may not support clipboard images.");
    }
  }
}

/**
 * 2. Base Layer Controller
 */
class BaseLayerController {
  constructor(map, selectId) {
    this.map = map;
    this.baseLayers = {};
    this.activeBase = null;
    this.originalSelect = document.getElementById(selectId);
    
    // UI Construction
    this.originalSelect.style.display = "none";
    this.dropdown = document.createElement("div");
    this.dropdown.className = "blc-dropdown";
    this.selected = document.createElement("div");
    this.selected.className = "blc-selected";
    this.selected.textContent = "Select base layer";
    this.dropdown.appendChild(this.selected);
    this.optionsContainer = document.createElement("div");
    this.optionsContainer.className = "blc-options";
    this.dropdown.appendChild(this.optionsContainer);
    this.originalSelect.parentNode.insertBefore(this.dropdown, this.originalSelect);

    // Events
    this.selected.addEventListener("click", () => this.optionsContainer.classList.toggle("blc-show"));
    document.addEventListener("click", (e) => {
      if (!this.dropdown.contains(e.target)) this.optionsContainer.classList.remove("blc-show");
    });
  }

  addBase(key, config) {
    this.baseLayers[key] = config.tileLayer;
    
    // Original Select
    const option = document.createElement("option");
    option.value = key;
    option.textContent = config.label;
    this.originalSelect.appendChild(option);

    // Custom UI
    const customOption = document.createElement("div");
    customOption.className = "blc-option";
    customOption.dataset.key = key;
    if (config.icon) {
      const img = document.createElement("img");
      img.src = config.icon;
      img.className = "blc-option-icon";
      customOption.appendChild(img);
    }
    const label = document.createElement("span");
    label.textContent = config.label;
    customOption.appendChild(label);

    customOption.addEventListener("click", () => {
      this.setBase(key);
      this.selected.innerHTML = "";
      if (config.icon) {
        const imgClone = customOption.querySelector("img").cloneNode();
        imgClone.className = "blc-selected-icon";
        this.selected.appendChild(imgClone);
      }
      const text = document.createElement("span");
      text.textContent = config.label;
      this.selected.appendChild(text);
      this.optionsContainer.classList.remove("blc-show");
      this.originalSelect.value = key;
    });

    this.optionsContainer.appendChild(customOption);
    if (!this.activeBase) customOption.click();
  }

  setBase(key) {
    const layer = this.baseLayers[key];
    if (!layer) return;
    if (this.activeBase) this.map.removeLayer(this.activeBase);
    layer.addTo(this.map);
    this.activeBase = layer;
  }
}

/**
 * 3. Overlay Manager (Encapsulation logic)
 * Handles registering overlays, their checkboxes, sliders, and panes.
 */
class OverlayManager {
  constructor(map, paneName = 'overlayPaneTop', zIndex = 200) {
    this.map = map;
    this.paneName = paneName;
    
    // Ensure pane exists
    if (!this.map.getPane(this.paneName)) {
      this.map.createPane(this.paneName);
      this.map.getPane(this.paneName).style.zIndex = zIndex;
    }
  }

  /**
   * Register a new overlay or set of overlays linked to one UI toggle.
   * @param {string} toggleId - HTML ID of the checkbox
   * @param {string} sliderId - HTML ID of the range slider
   * @param {Array|Object} layerConfigs - One or more layer configuration objects
   * @param {boolean} visibleByDefault - Whether it starts checked
   */
  register(toggleId, sliderId, layerConfigs, visibleByDefault = false) {
    const configs = Array.isArray(layerConfigs) ? layerConfigs : [layerConfigs];
    const layers = [];

    // Create Leaflet layers from configs
    configs.forEach(cfg => {
      let layer;
      const options = {
        attribution: cfg.attribution,
        opacity: 1.0, // Managed by slider
        pane: this.paneName,
        bounds: cfg.bounds,
        noWrap: true,
        continuousWorld: false,
        ...cfg.extraOptions
      };

      if (cfg.type === 'wms') {
        layer = L.tileLayer.wms(cfg.url, {
            ...options,
            layers: cfg.layers,
            format: 'image/png',
            transparent: true,
            version: cfg.version || '1.1.1'
        });
      } else {
        // Default TileLayer
        layer = L.tileLayer(cfg.url, options);
      }
      
      layers.push(layer);
      
      if (visibleByDefault) {
        layer.addTo(this.map);
      }
    });

    // Bind UI Events
    const checkbox = document.getElementById(toggleId);
    const slider = document.getElementById(sliderId);

    if (checkbox) {
      checkbox.checked = visibleByDefault;
      checkbox.addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        layers.forEach(l => {
          if (isChecked) l.addTo(this.map);
          else this.map.removeLayer(l);
        });
      });
    }

    if (slider) {
      slider.addEventListener('input', (e) => {
        const val = e.target.value;
        layers.forEach(l => l.setOpacity(val));
      });
    }

    return layers;
  }
}

/**
 * 4. User Location & Geolocation Manager
 */
class UserLocationManager {
  constructor(map, autoPanToggleId) {
    this.map = map;
    this.marker = null;
    this.lastPosition = null;
    this.autoPan = false;
    
    this._createPane();
    this._setupAutoPan(autoPanToggleId);
    this._setupLocateControl();
    this._startWatching();
  }

  _createPane() {
    if (!this.map.getPane('userLocationPane')) {
      this.map.createPane('userLocationPane');
      const pane = this.map.getPane('userLocationPane');
      pane.style.zIndex = 800;
      pane.style.pointerEvents = 'none';
    }
  }

  _setupAutoPan(toggleId) {
    const toggle = document.getElementById(toggleId);
    if(toggle) {
        toggle.addEventListener('change', e => this.autoPan = e.target.checked);
    }
  }

  _updatePosition(lat, lng) {
    const latlng = [lat, lng];
    this.lastPosition = latlng;

    if (!this.marker) {
      this.marker = L.marker(latlng, {
        pane: 'userLocationPane',
        icon: L.divIcon({
          className: 'user-pulse-marker',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(this.map);
    } else {
      this.marker.setLatLng(latlng);
    }

    if (this.autoPan) {
        this.map.setView(latlng);
    }
  }

  _startWatching() {
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          this._updatePosition(pos.coords.latitude, pos.coords.longitude);
        },
        err => console.warn("Geolocation access denied or error", err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }
  }

  _setupLocateControl() {
    const locateButton = L.control({ position: 'topright' });
    locateButton.onAdd = () => {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
      div.innerHTML = `
        <a href="#" title="Go to my location" style="display:block;line-height:26px;text-align:center;color:inherit;">
          <span class="material-icons" style="vertical-align:middle;font-size:20px;">gps_fixed</span>
        </a>`;
      div.onclick = (e) => {
        e.preventDefault();
        if (this.lastPosition) {
          this.map.setView(this.lastPosition, 16);
        } else {
          alert("Location not available yet");
        }
      };
      return div;
    };
    locateButton.addTo(this.map);
  }
}

/**
 * 5. Share Manager (Utility)
 */
class ShareManager {
  static compress(obj) { return LZString.compressToEncodedURIComponent(JSON.stringify(obj)); }
  static decompress(str) {
    try { return JSON.parse(LZString.decompressFromEncodedURIComponent(str)); } catch { return null; }
  }
  static generateShareURL(favObj) {
    const payload = this.compress(favObj);
    const url = new URL(window.location.href);
    url.searchParams.set('favdata', payload);
    return url.toString();
  }
  static loadSharedFavorite() {
    const params = new URLSearchParams(window.location.search);
    const data = params.get('favdata');
    if (!data) return null;
    return this.decompress(data);
  }
}

/**
 * 6. Drawing Manager
 */
class DrawingManager {
  constructor(map) {
    this.map = map;
    this.paneName = "custom-drawing-pane";
    this._ensurePane();
    this.drawnItems = new L.FeatureGroup(null, { pane: this.paneName });
    this.map.addLayer(this.drawnItems);

    this.drawControl = new L.Control.Draw({
      position: 'topright',
      draw: { polygon: true, polyline: false, rectangle: false, circle: false, marker: true },
      edit: false
    });
    this.editControl = null;
    this.map.on(L.Draw.Event.CREATED, (e) => this.onCreated(e));
  }

  _ensurePane() {
    if (!this.map.getPane(this.paneName)) {
      const pane = this.map.createPane(this.paneName);
      pane.style.zIndex = 700;
      pane.style.pointerEvents = "auto";
    }
  }

  onCreated(event) {
    const layer = event.layer;
    layer.options.pane = this.paneName;
    this.drawnItems.addLayer(layer);
  }

  clear() { this.drawnItems.clearLayers(); }

  loadGeoJSON(geojson) {
    this.clear();
    if (!geojson || !geojson.features?.length) return;
    L.geoJSON(geojson, {
      pane: this.paneName,
      pointToLayer: (feature, latlng) => L.marker(latlng, { pane: this.paneName })
    }).eachLayer(layer => this.drawnItems.addLayer(layer));
  }

  toGeoJSON() { return this.drawnItems.toGeoJSON(); }

  enableEditMode() {
    if (this.editControl) return;
    if (this.drawControl) this.map.removeControl(this.drawControl);
    this.editControl = new L.Control.Draw({
      position: 'topright',
      draw: { polygon: true, polyline: false, rectangle: false, circle: false, marker: true },
      edit: { featureGroup: this.drawnItems, remove: true }
    });
    this.map.addControl(this.editControl);
  }

  disableEditMode() {
    if (this.editControl) {
      this.map.removeControl(this.editControl);
      this.editControl = null;
    }
    if (!this.drawControl) {
      this.drawControl = new L.Control.Draw({
        position: 'topright',
        draw: { polygon: true, polyline: false, rectangle: false, circle: false, marker: true },
        edit: false
      });
    }
    this.map.addControl(this.drawControl);
  }
}

/**
 * 7. Favorite Manager
 */
class FavoriteManager {
  constructor(map, drawingManager, listElement) {
    this.map = map;
    this.drawingManager = drawingManager;
    this.listElement = listElement;
    this.storageKey = 'favorites';
    this.data = [];
    this.activeIndex = null;
    this.editIndex = null;
    this.load();
  }

  load() {
    try { this.data = JSON.parse(localStorage.getItem(this.storageKey) || '[]'); }
    catch { this.data = []; }
    this._renderList();
  }

  saveStorage() { localStorage.setItem(this.storageKey, JSON.stringify(this.data)); }

  addFavorite(name) {
    const center = this.map.getCenter();
    const zoom = this.map.getZoom();
    const shapes = this.drawingManager.toGeoJSON();
    this.data.push({ name, center, zoom, shapes });
    this.saveStorage();
    this._renderList();
    this.drawingManager.clear();
  }

  deleteFavorite(index) {
    if (this.editIndex === index) this.cancelEdit();
    this.data.splice(index, 1);
    this.saveStorage();
    this._renderList();
    this.drawingManager.clear();
  }

  openFavorite(index, options = { confirmDiscard: true }) {
    if (this.editIndex !== null && this.editIndex !== index && options.confirmDiscard) {
      if (!confirm('You have unsaved edits. Discard changes?')) return false;
      this.cancelEdit();
    }
    const fav = this.data[index];
    if (!fav) return false;
    this.map.setView(fav.center, fav.zoom);
    this.activeIndex = index;
    this.drawingManager.loadGeoJSON(fav.shapes || { type: 'FeatureCollection', features: [] });
    this.drawingManager.disableEditMode();
    return true;
  }

  enterEditMode(index) {
    const fav = this.data[index];
    if (!fav) return false;
    this.map.setView(fav.center, fav.zoom);
    if (this.editIndex !== null && this.editIndex !== index) {
      if (!confirm('You have unsaved edits. Discard changes?')) return false;
      this.cancelEdit();
    }
    this.editIndex = index;
    this.drawingManager.loadGeoJSON(fav.shapes || { type: 'FeatureCollection', features: [] });
    this.drawingManager.enableEditMode();
    return true;
  }

  saveEditedShapes() {
    if (this.editIndex === null) return false;
    const shapes = this.drawingManager.toGeoJSON();
    this.data[this.editIndex].shapes = shapes;
    this.saveStorage();
    this._renderList();
    this.cancelEdit();
    return true;
  }

  cancelEdit() {
    if (this.editIndex === null) return;
    const fav = this.data[this.editIndex];
    if (fav && fav.shapes) this.drawingManager.loadGeoJSON(fav.shapes);
    else this.drawingManager.clear();
    this.editIndex = null;
    this.drawingManager.disableEditMode();
    this.drawingManager.clear();
  }

  _renderList() {
    this.listElement.innerHTML = '';
    this.data.forEach((fav, i) => {
      const li = document.createElement('li');
      li.className = 'fav-row';

      const left = document.createElement('div');
      left.className = 'fav-left';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'fav-name';
      nameSpan.textContent = fav.name;
      nameSpan.title = 'Open favorite (view only)';
      nameSpan.addEventListener('click', () => this.openFavorite(i, { confirmDiscard: true }));
      left.appendChild(nameSpan);

      const right = document.createElement('div');
      right.className = 'fav-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-small';
      editBtn.innerHTML = '<span class="material-icons">edit</span>';
      editBtn.title = 'Edit shapes';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        UIManager.showEditBanner(this.data[i].name);
        this.enterEditMode(i);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-small btn-delete';
      deleteBtn.innerHTML = '<span class="material-icons">close</span>';
      deleteBtn.title = 'Delete';
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`Delete favorite "${fav.name}"?`)) this.deleteFavorite(i);
      });

      const shareBtn = document.createElement('button');
      shareBtn.className = 'btn-small';
      shareBtn.innerHTML = '<span class="material-icons">share</span>';
      shareBtn.title = 'Share';
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const url = ShareManager.generateShareURL(this.data[i]);
        if (navigator.share) {
          navigator.share({ title: fav.name, text: 'Shared via Zoekmap', url });
        } else {
          navigator.clipboard.writeText(url);
          alert('Share link copied to clipboard');
        }
      });

      right.append(shareBtn, editBtn, deleteBtn);
      li.append(left, right);
      this.listElement.appendChild(li);
    });
  }
}

/**
 * 8. UI Manager (DOM Interactions)
 */
const UIManager = (function () {
  let favManager = null;
  let drawingManager = null;

  const cache = {
    drawer: document.getElementById('drawer'),
    menuBtn: document.getElementById('menuBtn'),
    closeDrawerBtn: document.getElementById('closeDrawerBtn'),
    newViewBtn: document.getElementById('newViewBtn'),
    saveNewViewBtn: document.getElementById('saveNewViewBtn'),
    cancelNewViewBtn: document.getElementById('cancelNewViewBtn'),
    saveCancelWrapper: document.getElementById('saveCancelWrapper'),
    favoritesList: document.getElementById('favoritesList'),
    editBanner: document.getElementById('editBanner'),
    editingFavName: document.getElementById('editingFavName'),
    saveChangesBtn: document.getElementById('saveChangesBtn'),
    cancelEditBtn: document.getElementById('cancelEditBtn')
  };

  function init(managers) {
    favManager = managers.favManager;
    drawingManager = managers.drawingManager;

    cache.menuBtn.addEventListener('click', () => { cache.drawer.classList.add('open'); cache.menuBtn.classList.add('hidden'); });
    cache.closeDrawerBtn.addEventListener('click', () => { cache.drawer.classList.remove('open'); cache.menuBtn.classList.remove('hidden'); });

    cache.newViewBtn.addEventListener('click', () => {
      drawingManager.clear();
      drawingManager.enableEditMode();
      cache.newViewBtn.style.display = 'none';
      cache.saveCancelWrapper.style.display = 'flex';
    });

    cache.saveNewViewBtn.addEventListener('click', () => {
      const name = prompt('Enter a name for this view:');
      if (!name) return;
      favManager.addFavorite(name);
      drawingManager.disableEditMode();
      drawingManager.clear();
      cache.saveCancelWrapper.style.display = 'none';
      cache.newViewBtn.style.display = 'flex';
    });

    cache.cancelNewViewBtn.addEventListener('click', () => {
      drawingManager.clear();
      drawingManager.disableEditMode();
      cache.saveCancelWrapper.style.display = 'none';
      cache.newViewBtn.style.display = 'flex';
    });

    cache.saveChangesBtn.addEventListener('click', () => {
      favManager.saveEditedShapes();
      hideEditBanner();
    });

    cache.cancelEditBtn.addEventListener('click', () => {
      if (!confirm('Discard edits?')) return;
      favManager.cancelEdit();
      hideEditBanner();
    });
  }

  function showEditBanner(name) {
    cache.editBanner.style.display = 'block';
    cache.editingFavName.textContent = 'Editing: ' + name;
  }

  function hideEditBanner() {
    cache.editBanner.style.display = 'none';
    cache.editingFavName.textContent = '';
  }

  return { init, showEditBanner, hideEditBanner };
})();


/**
 * 9. Main Application Class
 * Bootstraps the map and ties all managers together.
 */
class ZoekMapApp {
  constructor(mapId) {
    this.map = L.map(mapId).setView([50.85, 4.35], 9);
    this.map.zoomControl.setPosition('bottomright');
    
    // Initialize components
    this.baseLayerCtrl = new BaseLayerController(this.map, "base-layer-select");
    this.overlayManager = new OverlayManager(this.map);
    this.drawingManager = new DrawingManager(this.map);
    this.favManager = new FavoriteManager(this.map, this.drawingManager, document.getElementById('favoritesList'));
    this.userLocManager = new UserLocationManager(this.map, 'autoPanToggle');
    this.screenshotManager = new ScreenshotManager(this.map, "copyScreenshotBtn");
    
    this.init();
  }

  init() {
    this.setupBaseLayers();
    this.setupOverlays();
    this.setupGeocoder();
    
    // Initialize UI Logic
    UIManager.init({ 
      favManager: this.favManager, 
      drawingManager: this.drawingManager 
    });

    // Handle Shared Link
    const shared = ShareManager.loadSharedFavorite();
    if (shared) {
      this.drawingManager.loadGeoJSON(shared.shapes);
      this.map.setView(shared.center, shared.zoom);
    }
    
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW Registered'))
        .catch(err => console.error('SW Error:', err));
    }
  }

  setupBaseLayers() {
    const bases = [
      { key: "googleHybrid", label: "Google Hybrid", url: "https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}", icon: "https://www.google.com/favicon.ico" },
      { key: "googleSatellite", label: "Google Satellite", url: "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", icon: "https://www.google.com/favicon.ico" },
      { key: "googleTerrain", label: "Google Terrain", url: "https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}", icon: "https://www.google.com/favicon.ico" },
      { key: "osm", label: "OpenStreetMap", url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", icon: "https://www.openstreetmap.org/favicon.ico" },
      { key: "cartoLight", label: "Carto Light", url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", icon: "https://carto.com/favicon.ico" },
      { key: "cartoDark", label: "Carto Dark", url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", icon: "https://carto.com/favicon.ico" },
      { key: "esri", label: "ESRI World Imagery", url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", icon: "https://www.arcgis.com/sharing/rest/community/users/esri/info/esri_150.jpg" }
    ];

    bases.forEach(b => {
      this.baseLayerCtrl.addBase(b.key, {
        label: b.label,
        icon: b.icon,
        tileLayer: L.tileLayer(b.url, { subdomains: ["mt0", "mt1", "mt2", "mt3"], attribution: b.label })
      });
    });
  }

  setupOverlays() {
    // 1. Ferraris (Combined Flemish + Walloon)
    this.overlayManager.register('ferrarisToggle', 'opacitySliderFerraris', [
      {
        type: 'tile',
        url: 'https://geo.api.vlaanderen.be/HISTCART/wmts?service=WMTS&request=GetTile&version=1.0.0&layer=ferraris&style=&tilematrixset=GoogleMapsVL&format=image/png&tilematrix={z}&tilerow={y}&tilecol={x}',
        bounds: [[50.685, 2.53], [51.520, 5.92]],
        attribution: '© Vlaanderen'
      },
      {
        type: 'wms',
        url: 'https://geoservices.wallonie.be/arcgis/services/CARTES_ANCIENNES/FERRARIS/MapServer/WMSServer',
        layers: '0',
        bounds: [[49.451080, 2.560669], [50.956140, 6.498683]],
        attribution: '© SPW – Ferraris',
        version: '1.3.0'
      }
    ], true); // Checked by default

    // 2. GRB
    this.overlayManager.register('grbToggle', 'opacitySliderGRB', {
      type: 'tile',
      url: 'https://geo.api.vlaanderen.be/GRB/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=grb_bsk&STYLE=&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png',
      bounds: [[50.685, 2.53], [51.52, 5.92]],
      attribution: '© Vlaanderen GRB'
    });

    // 3. Hillshade
    this.overlayManager.register('hillshadeToggle', 'opacitySliderHillshade', {
      type: 'tile',
      url: 'https://geo.api.vlaanderen.be/DHMV/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=DHMV_II_HILL_25cm&STYLE=&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png',
      bounds: [[50.64, 2.52], [51.51, 5.94]],
      attribution: '© Vlaanderen DHMV II'
    });

    // 4. DHMV (WMS)
    this.overlayManager.register('dhmvToggle', 'opacitySliderDhmv', {
      type: 'wms',
      url: 'https://geo.api.vlaanderen.be/DHMV/wms',
      layers: 'DHMVII_DTM_1m',
      bounds: [[50.64, 2.52], [51.51, 5.94]],
      attribution: '© Vlaanderen',
      version: '1.3.0'
    });
  }

  setupGeocoder() {
    L.Control.geocoder({ 
      defaultMarkGeocode: true, 
      placeholder: 'Search location...', 
      errorMessage: 'Not found' 
    })
    .on('markgeocode', (e) => this.map.setView(e.geocode.center, 16))
    .addTo(this.map);
  }
}

// Start the App
document.addEventListener('DOMContentLoaded', () => {
  window.app = new ZoekMapApp('map');
});

</script>
</body>
</html>
